name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - "resume-zh_CN.tex"
      - "resume.cls"
      - "linespacing_fix.sty"
      - "assets/**"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            fonts-noto-cjk
          fc-cache -f
          mkdir -p fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc fonts/NotoSansCJK-Regular.ttc
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc fonts/NotoSansCJK-Bold.ttc

      - name: Build PDF
        run: |
          set +e
          xelatex -interaction=nonstopmode -halt-on-error resume-zh_CN.tex > build-resume.log 2>&1
          status=$?
          cat build-resume.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build-resume.log
            git commit -m "Record resume build failure"
            git push
            exit "$status"
          fi
          set -e
          xelatex -interaction=nonstopmode -halt-on-error resume-zh_CN.tex
          mv resume-zh_CN.pdf "湖南大学计算机硕士-叶子钰.pdf"
          rm -f build-resume.log

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- "湖南大学计算机硕士-叶子钰.pdf"; then
            echo "PDF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "湖南大学计算机硕士-叶子钰.pdf"
          git commit -m "Build updated resume PDF"
          git push
